name: Publish prepared v2.3.16 analytics release

on:
  push:
    branches: [codex/full-parity-mirror]
    paths: [.github/workflows/publish-prepared-release.yml]

permissions:
  contents: write

concurrency:
  group: publish-v2.3.16
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: vlasthaus22-cyber/Mac_analyzer_Pro_Next
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned parity reference
        uses: actions/checkout@v4
        with:
          repository: vlasthaus22-cyber/Mac_analyzer_Pro
          ref: ceb0f544ad4c5e931902817ff7a7b08109e7aecc
          path: .reference/Mac_analyzer_Pro
      - name: Arrange reference files for parity tests
        shell: pwsh
        run: |
          Copy-Item -LiteralPath '.reference/Mac_analyzer_Pro' -Destination '../Mac_analyzer_Pro' -Recurse
          Copy-Item -LiteralPath 'tests/fixtures/reference-pyqt.py' -Destination '../MAC_ANALYZER финальная.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify existing draft and version
        shell: pwsh
        run: |
          if ((Get-Content package.json | ConvertFrom-Json).version -ne '2.3.16') { throw 'Unexpected application version' }
          $release = gh api repos/$env:GH_REPO/releases/454410763 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.draft -or $release.tag_name -ne 'v2.3.16') { throw 'Expected unpublished v2.3.16 draft' }
      - name: Install build dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-windows-packaging.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run full checks and build complete package
        shell: pwsh
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-release-readiness.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify latest Final, vendor chart and archive receipt in Edge
        shell: pwsh
        run: |
          $id = [guid]::NewGuid().ToString('N')
          $profile = Join-Path $env:RUNNER_TEMP "edge-archive-$id"
          $url = ([uri](Resolve-Path 'dist/MAC-Analyzer-Pro-Next.html').Path).AbsoluteUri + "?db=mac-analyzer-pro-next-test-$id"
          Start-Process 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' -WindowStyle Hidden -ArgumentList @('--headless=new', '--disable-gpu', '--no-first-run', '--remote-allow-origins=*', '--remote-debugging-address=127.0.0.1', '--remote-debugging-port=9357', "--user-data-dir=$profile", $url)
          node tools/browser-smoke.mjs 9357 $url --address-roster-regression-only
          exit $LASTEXITCODE
      - name: Upload complete program and checksums
        shell: pwsh
        run: |
          gh release upload v2.3.16 dist/MAC-Analyzer-Pro-Next-full.zip dist/MAC-Analyzer-Pro-Next-full.zip.sha256 dist/MAC-Analyzer-Pro-Next.html dist/MAC-Analyzer-Pro-Next.html.sha256 dist/MAC-Analyzer-Pro-Next-Host.exe dist/MAC-Analyzer-Pro-Next-Host.exe.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh api repos/$env:GH_REPO/releases/454410763 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.assets.Count -ne 6) { throw 'Expected six release assets' }
          foreach ($asset in $release.assets) {
            $local = Join-Path dist $asset.name
            if ($asset.state -ne 'uploaded' -or !(Test-Path -LiteralPath $local)) { throw 'Missing release asset' }
            if ((Get-Item -LiteralPath $local).Length -ne $asset.size) { throw 'Asset size mismatch' }
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.digest -ne $digest) { throw 'Asset checksum mismatch' }
          }
      - name: Publish stable release
        shell: pwsh
        run: |
          gh api --method PATCH repos/$env:GH_REPO/releases/454410763 -f tag_name=v2.3.16 -f "target_commitish=$env:GITHUB_SHA" -F draft=false -F prerelease=false -f make_latest=true --jq .html_url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
